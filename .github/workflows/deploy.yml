name: Build and deploy to R2
#
# CI Build and Deploy
#
# This workflow is the production path that publishes the Zasqua site.
# It runs on demand (workflow_dispatch) — typically after a new data
# export is pushed to Backblaze B2 or after a change is merged to main
# that needs to reach zasqua.org.
#
# There are two equally valid ways to build the site: locally on a
# contributor's machine (using `build.sh`) or here in GitHub Actions,
# which additionally uploads the build to Cloudflare R2 and purges the
# edge cache so visitors see the new version immediately.
#
# Pipeline:
#
#   1. Check out the repo and set up Node (version pinned in `.nvmrc`)
#      and Python runtimes
#   2. Install the Backblaze B2 CLI and `boto3`
#   3. Download all data exports from the `zasqua-export` B2 bucket —
#      descriptions, repositories, per-description children shards,
#      entities, places, entity_links, and place_links
#   4. Run `scripts/precompute-links.js` to shard the link tables per
#      authority record and build the explorer index files
#   5. Run `scripts/places-to-geojson.js` and tippecanoe to generate
#      the PMTiles used by the place explorer's clustered marker map,
#      then upload the PMTiles to the `zasqua-map-tiles` R2 bucket
#   6. Install npm dependencies with `npm ci`
#   7. Download the standalone Tailwind CSS binary and compile
#      `src/css/input.css` into `src/css/main.css`
#   8. Run Eleventy to render the static site into `_site/`, with a
#      generous Node heap size for the large build
#   9. Run Pagefind three times to build the main description search
#      index, the entity explorer index, and the place explorer index
#  10. Upload `_site/` to the `zasqua-site` R2 bucket in parallel using
#      `scripts/upload-to-r2.py`
#  11. Purge the Cloudflare edge cache so the new build is served
#      straight away
#
# Secrets required: `B2_APPLICATION_KEY_ID`, `B2_APPLICATION_KEY`,
# `R2_ACCESS_KEY_ID`, `R2_SECRET_ACCESS_KEY`, `CLOUDFLARE_ACCOUNT_ID`,
# `CF_API_TOKEN`, and `CF_ZONE_ID`.
#
# Version: v0.5.0

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          pip install "b2[full]" --quiet
          pip install boto3 --quiet

      - name: Download data from B2
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          b2 account authorize "$B2_APPLICATION_KEY_ID" "$B2_APPLICATION_KEY"
          mkdir -p data/children data/entity-links data/place-links
          b2 file download b2://zasqua-export/descriptions.json data/descriptions.json
          b2 file download b2://zasqua-export/repositories.json data/repositories.json
          b2 sync b2://zasqua-export/children/ data/children/
          ls -lh data/descriptions.json data/repositories.json
          echo "Children files: $(ls data/children/ | wc -l)"
          b2 file download b2://zasqua-export/entities.json data/entities.json
          b2 file download b2://zasqua-export/places.json data/places.json
          b2 file download b2://zasqua-export/entity_links.json data/entity_links.json
          b2 file download b2://zasqua-export/place_links.json data/place_links.json
          ls -lh data/entities.json data/places.json data/entity_links.json data/place_links.json

      - name: Pre-compute link shards and index files
        run: |
          node scripts/precompute-links.js
          echo "Entity shards: $(ls data/entity-links/ | wc -l)"
          echo "Place shards: $(ls data/place-links/ | wc -l)"
          ls -lh data/entity-index.json data/place-index.json

      - name: Install Tippecanoe
        run: pip install tippecanoe==2.72.0

      - name: Generate PMTiles
        run: |
          node scripts/places-to-geojson.js
          tippecanoe -Z0 -z14 --drop-densest-as-needed -l places \
            -o data/zasqua-places.pmtiles data/places.geojson
          ls -lh data/zasqua-places.pmtiles

      - name: Upload PMTiles to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          python3 - << 'EOF'
          import boto3, os
          s3 = boto3.client('s3',
              endpoint_url=os.environ['R2_ENDPOINT'],
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
          )
          s3.upload_file('data/zasqua-places.pmtiles', 'zasqua-map-tiles', 'zasqua-places.pmtiles',
              ExtraArgs={'ContentType': 'application/octet-stream'})
          print("PMTiles uploaded to zasqua-map-tiles/zasqua-places.pmtiles")
          EOF

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS with Tailwind
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
          ./tailwindcss-linux-x64 -i src/css/input.css -o src/css/main.css --minify

      - name: Build site with Eleventy
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          SITE_URL: https://zasqua.org
        run: |
          npx eleventy
          echo "Pages: $(find _site -name 'index.html' | wc -l)"
          echo "Site size: $(du -sh _site | cut -f1)"

      - name: Index with Pagefind
        run: |
          # Run 1: Description search index (exclude entity and place pages)
          npx pagefind --site _site --output-subdir pagefind \
            --exclude-selectors "[data-pagefind-entity-page],[data-pagefind-place-page]"

          # Run 2: Entity explorer index — entity pages at /ne-{code}/
          npx pagefind --site _site --output-subdir pagefind-entities \
            --glob "ne-*/**/*.html"

          # Run 3: Place explorer index — place pages at /nl-{id}/
          npx pagefind --site _site --output-subdir pagefind-places \
            --glob "nl-*/**/*.html"

      - name: Deploy to R2
        env:
          PYTHONUNBUFFERED: "1"
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: python3 scripts/upload-to-r2.py _site zasqua-site --concurrency 100

      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything": true}'
          echo "Cache purged"
