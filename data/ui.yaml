# Zasqua UI strings — Colombian Spanish
#
# This file holds every piece of short Spanish text the Hugo templates
# need at render time: navigation labels, button copy, facet names,
# archival level names (ISAD(G) — Fondo, Serie, Expediente, etc.),
# role translations for entity links (Productor, Testigo, Escribano…),
# per-record provenance strings for ISAD(G) 3.7.3 / ISAAR(CPF) 5.4.7
# revision dates, and the error-page and footer wording. Templates
# reach these strings via `.Site.Data.ui`, so e.g.
# `{{ .Site.Data.ui.nav.home }}` renders "Inicio". The file is small
# on purpose — only flat lookups live here, not the large archival
# JSON, which is sharded on disk and loaded lazily inside the content
# adapters.
#
# Role labels are intentionally lowercase (Productor, Testigo...) —
# they appear mid-sentence in rendered entity-link rows, not as
# standalone headings.
#
# Version: v1.0.0

